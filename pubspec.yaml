name: milingo
description: "AI-powered language learning Flutter app with Snap & Learn feature"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase Backend & Auth
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # Camera & Image Processing
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # AI Integration (Gemini)
  google_generative_ai: ^0.4.6

  # Audio (Text-to-Speech)
  flutter_tts: ^4.0.2

  # Network & HTTP Client
  dio: ^5.5.0+1

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation for Riverpod
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets directories
  # assets:
  #   - assets/images/
  #   - assets/audio/
  #   - assets/icons/

  # Fonts
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
